<!--
  Supabase Dashboard → Authentication → Emails → Confirm signup
  Subject: FormFlow 註冊驗證碼
  Paste this as the message body. The app's 驗證信箱 page asks for
  {{ .Token }}; there is no link to click.
-->
<h2>歡迎加入 FormFlow</h2>
<p>請在 App 的「驗證信箱」頁輸入以下驗證碼，完成 {{ .Email }} 的註冊：</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 6px;">{{ .Token }}</p>
<p>驗證碼一小時內有效。如果你沒有註冊 FormFlow，可以忽略這封信。</p>
